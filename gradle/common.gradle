// Shared configuration applied by every versions/<mc>/build.gradle after the Loom plugin.
version = "${rootProject.mod_version}+mc${project.minecraft_version}"
group = rootProject.maven_group
base { archivesName = rootProject.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file('shared/resources')
        }
        // Java sources are generated by preprocessJava (see below).
        java { srcDirs = [layout.buildDirectory.dir('preprocessed/java')] }
        if (project.hasProperty('res_src')) {
            resources { srcDir rootProject.file(project.res_src) }
        }
    }
}

static String packFormatFields(Object fmt, Object style) {
    switch (style.toString()) {
        case 'old': return "\"pack_format\": ${fmt}"
        case 'mixed': return "\"pack_format\": ${fmt},\n    \"supported_formats\": [${fmt}, ${fmt}],\n    \"min_format\": ${fmt},\n    \"max_format\": ${fmt}"
        default: return "\"min_format\": [${fmt}, 0],\n    \"max_format\": [${fmt}, 0]"
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def props = [
            version          : rootProject.mod_version,
            minecraft_range  : project.minecraft_range,
            loader_version   : project.loader_version,
            java_version     : project.java_version,
            mixin_java       : "JAVA_${project.java_version}",
            pack_format_fields: packFormatFields(project.findProperty('pack_format') ?: '0', project.findProperty('pack_style') ?: 'new'),
            extra_client_mixins: (project.findProperty('extra_client_mixins') ?: '').toString().tokenize(',').collect { ',\n    "' + it.trim() + '"' }.join(''),
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', '*.mixins.json', 'pack.mcmeta']) {
        expand props
    }
}

java {
    def v = JavaVersion.toVersion(project.java_version as int)
    sourceCompatibility = v
    targetCompatibility = v
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '2000']
    it.options.release = project.java_version as int
}


// ---------------------------------------------------------------------------
// Tiny source preprocessor.  Shared sources live in <java_src>; per-version files in
// versions/<mc>/src/main/java override shared files with the same path.
// Supported directives (each on its own line, leading whitespace allowed):
//   //#if MC >= 26.3 && MC < 26.4      //#elif MC == 1.21.11      //#else      //#endif
// ---------------------------------------------------------------------------
static List<Integer> mcParse(String v) {
    def parts = v.trim().tokenize('.').collect { it as int }
    while (parts.size() < 3) parts << 0
    return parts
}
static int mcCompare(String a, String b) {
    def x = mcParse(a), y = mcParse(b)
    for (int i = 0; i < 3; i++) { if (x[i] != y[i]) return x[i] <=> y[i] }
    return 0
}
static boolean mcEval(String expr, String mc) {
    return expr.split(/\|\|/).any { orPart ->
        orPart.split('&&').every { term ->
            def m = (term.trim() =~ /^MC\s*(>=|<=|==|!=|>|<)\s*([0-9.]+)$/)
            if (!m.matches()) throw new GradleException("Bad preprocessor condition: '${term}'")
            int c = mcCompare(mc, m.group(2))
            switch (m.group(1)) {
                case '>=': return c >= 0
                case '<=': return c <= 0
                case '>': return c > 0
                case '<': return c < 0
                case '==': return c == 0
                default: return c != 0
            }
        }
    }
}
static String mcPreprocess(String text, String mc, String name) {
    def out = new StringBuilder()
    def stack = []   // each: [parentActive, branchTaken, currentActive]
    boolean active = true
    text.eachLine { line ->
        def t = line.trim()
        if (t.startsWith('//#if ')) {
            boolean cond = mcEval(t.substring(6), mc)
            stack.push([active, cond])
            active = active && cond
        } else if (t.startsWith('//#elif ')) {
            def top = stack.last()
            boolean cond = !top[1] && mcEval(t.substring(8), mc)
            if (cond) top[1] = true
            active = top[0] && cond
        } else if (t == '//#else') {
            def top = stack.last()
            active = top[0] && !top[1]
            top[1] = true
        } else if (t == '//#endif') {
            def top = stack.pop()
            active = top[0]
        } else if (active) {
            out.append(line).append('\n')
            return
        }
        out.append('\n') // keep line numbers stable
    }
    if (!stack.isEmpty()) throw new GradleException("Unclosed //#if in ${name}")
    return out.toString()
}

def sharedJavaDirs = ((project.findProperty('java_src') ?: 'src/java26').toString() + ',' + (project.findProperty('extra_java') ?: '')).tokenize(',').collect { rootProject.file(it.trim()) }
def localJava = project.file('src/main/java')
def ppOut = layout.buildDirectory.dir('preprocessed/java')
def mcVer = project.minecraft_version as String
// Optional rename tables: lines "old.Name => new.Name" (whole-word, literal), applied in order.
def remapFiles = (project.findProperty('remaps') ?: '').toString().tokenize(',').collect { rootProject.file(it.trim()) }
def runPreprocess = { List<File> roots, File outDir ->
    project.delete(outDir)
    def renames = []
    remapFiles.each { rf ->
        rf.eachLine { l ->
            def t = l.trim()
            if (t.isEmpty() || t.startsWith('#')) return
            def parts = t.split('=>')
            def from = parts[0].trim()
            def pre = Character.isJavaIdentifierPart(from.charAt(0)) ? '(?<![\\w$])' : ''
            def post = Character.isJavaIdentifierPart(from.charAt(from.length() - 1)) ? '(?![\\w$])' : ''
            renames << [java.util.regex.Pattern.compile(pre + java.util.regex.Pattern.quote(from) + post),
                        java.util.regex.Matcher.quoteReplacement(parts[1].trim())]
        }
    }
    roots.each { root ->
        if (!root.exists()) return
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = root.toPath().relativize(f.toPath()).toString()
            def dest = new File(outDir, rel)
            dest.parentFile.mkdirs()
            def text = mcPreprocess(f.getText('UTF-8'), mcVer, rel)
            if (root != localJava) renames.each { r -> text = r[0].matcher(text).replaceAll(r[1]) }
            dest.setText(text, 'UTF-8')
        }
    }
}
def ppTask = tasks.register('preprocessJava') {
    inputs.files(remapFiles)
    sharedJavaDirs.each { if (it.exists()) inputs.dir(it) }
    if (localJava.exists()) inputs.dir(localJava)
    inputs.property('mc', mcVer)
    outputs.dir(ppOut)
    doLast { runPreprocess(sharedJavaDirs + [localJava], ppOut.get().asFile) }
}
tasks.named('compileJava') { dependsOn ppTask }

// Dev helper: writes the compile classpath to build/cp.txt
tasks.register('printCp') {
    def cp = sourceSets.main.compileClasspath
    def out = layout.buildDirectory.file('cp.txt')
    doLast { out.get().asFile.text = cp.files.join('\n') }
}

// ---------------------------------------------------------------------------
// Dev-only automated visual test mod (src/testmod). It is only added to the runClient
// launch, never to the published jar.
// ---------------------------------------------------------------------------
def testmodJava = rootProject.file('src/testmod/java')
def testmodOut = layout.buildDirectory.dir('preprocessed/testmod')
def ppTestTask = tasks.register('preprocessTestmod') {
    inputs.dir(testmodJava)
    inputs.files(remapFiles)
    inputs.property('mc', mcVer)
    outputs.dir(testmodOut)
    doLast { runPreprocess([testmodJava], testmodOut.get().asFile) }
}
sourceSets {
    testmod {
        java { srcDirs = [testmodOut] }
        resources { srcDirs = [rootProject.file('src/testmod/resources')] }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}
tasks.named('compileTestmodJava') { dependsOn ppTestTask }
loom {
    mods {
        tactical_arsenal { sourceSet sourceSets.main }
        tactical_arsenal_autotest { sourceSet sourceSets.testmod }
    }
    runs {
        client {
            source sourceSets.testmod
            vmArg '-Dtactical_arsenal.autotest=true'
        }
    }
}
